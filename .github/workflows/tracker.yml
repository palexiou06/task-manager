name: GitHub Projects Automation

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  move-issue-to-done:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if PR is merged and update the linked issue
        if: github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ISSUE=$(echo "$PR_BODY" | grep -oiE '(close[sd]?|fix(es|ed)?|resolve[sd]?) #[0-9]+' | head -n1 | grep -oE '[0-9]+')
          if [ -z "$ISSUE" ]; then
            echo "No linked issue found in the PR description."
            exit 0
          fi
          echo "PR #$PR_NUMBER merged, moving issue #$ISSUE to Done"
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "PR #$PR_NUMBER was merged. Moving this issue to Done."
          gh issue close "$ISSUE" --repo "${{ github.repository }}" || true
